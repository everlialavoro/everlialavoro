<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EVERLIA PROGETTO — Administration</title>
<link rel="icon" type="image/jpeg" href="logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
<canvas id="bg3d"></canvas>
<div class="bg-overlay"></div>

<header class="site-header">
  <a href="index.html" class="brand">
    <img src="logo.jpg" alt="EVERLIA PROGETTO" class="brand-logo" />
  </a>
  <div class="nav" style="margin-left:auto">
    <a href="index.html">Retour au site</a>
  </div>
  <button id="logout-btn" class="btn btn-outline" style="margin-left: 20px; padding: 8px 16px;" hidden>Déconnexion</button>
</header>

<!-- VUE CONNEXION -->
<section id="login-view" class="login-box">
  <h1>Espace Administrateur</h1>
  <p>Connectez-vous pour gérer les candidatures.</p>
  <form id="login-form">
    <div class="field">
      <label for="login-email">Adresse e-mail</label>
      <input id="login-email" type="email" required autocomplete="username" placeholder="votre@email.com" />
    </div>
    <div class="field">
      <label for="login-pass">Mot de passe</label>
      <input id="login-pass" type="password" required autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;margin-top:8px">Se connecter</button>
    <p id="login-error" class="error-msg" hidden></p>
  </form>
</section>

<!-- VUE TABLEAU DE BORD -->
<section id="dash-view" class="admin-wrap" hidden>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
    <h1 style="font-family:var(--font-display); font-size:32px; margin:0;">Candidatures</h1>
    <button id="refresh" class="btn btn-outline btn-sm">Actualiser les données</button>
  </div>

  <!-- Statistiques -->
  <div class="stats">
    <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
    <div class="stat"><strong id="stat-new">0</strong><span>Nouvelles</span></div>
    <div class="stat"><strong id="stat-cdi">0</strong><span>Contrats CDI</span></div>
    <div class="stat"><strong id="stat-today">0</strong><span>Aujourd'hui</span></div>
  </div>

  <!-- Barre d'outils -->
  <div class="toolbar">
    <input id="search" type="search" placeholder="Rechercher par nom, email, pays..." />
    <select id="filter-status">
      <option value="">Tous les statuts</option>
      <option value="nouveau">Nouveau</option>
      <option value="encours">En cours</option>
      <option value="accepte">Accepté</option>
      <option value="refuse">Refusé</option>
    </select>
    <button id="export-csv" class="btn btn-primary">Exporter CSV</button>
  </div>

  <!-- Liste des candidatures -->
  <div id="apps-list">
    <p class="empty-state">Chargement des candidatures...</p>
  </div>
</section>

<script type="module" src="three-bg.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
